version: '3.8'
services:
  postgres:
    build: ./postgres
    container_name: gq-postgres
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: genericquick }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./postgres/init-scripts:/docker-entrypoint-initdb.d]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 5 }
  redis:
    build: ./redis
    container_name: gq-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 5 }
  meilisearch:
    build: ./meilisearch
    container_name: gq-meilisearch
    environment: { MEILI_MASTER_KEY: dev-master-key }
    ports: ["7700:7700"]
    volumes: [meilisearch_data:/meili_data]
    healthcheck: { test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"], interval: 10s, timeout: 5s, retries: 5 }
  minio:
    build: ./minio
    container_name: gq-minio
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 10s, timeout: 5s, retries: 5 }
volumes: { postgres_data: {}, redis_data: {}, meilisearch_data: {}, minio_data: {} }